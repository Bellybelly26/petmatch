<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>PetMatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">🐾</div>
  <h1>PetMatch</h1>
  <button id="loginBtn">Login</button>
</header>

<!-- CARROSSEL -->
<section class="carousel">
  <div class="slides">
    <img src="https://placekitten.com/800/300">
    <img src="https://placedog.net/800/300">
    <img src="https://placebear.com/800/300">
  </div>
</section>

<!-- MENU -->
<nav id="menu" class="hidden">
  <button onclick="showPets()">Pets</button>
  <button onclick="showCompatibilidade()">Compatibilidade</button>
  <button onclick="showFavoritos()">Favoritos</button>
</nav>

<!-- PETS -->
<section id="petsSection" class="section">
  <h2>Pets disponíveis</h2>
  <input type="text" id="search" placeholder="Buscar pet...">
  <div id="petList" class="pet-list"></div>
</section>

<!-- FAVORITOS -->
<section id="favSection" class="section hidden">
  <h2>Favoritos</h2>
  <div id="favList" class="pet-list"></div>
</section>

<!-- COMPATIBILIDADE -->
<section id="compSection" class="section hidden">
  <h2>Teste de Compatibilidade</h2>

  <div id="quiz">
    <p>Onde você mora?</p>
    <button onclick="resposta('casa')">Casa</button>
    <button onclick="resposta('apto')">Apartamento</button>
  </div>

  <div id="resultado"></div>
</section>

<!-- MODAL LOGIN -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h2>Login</h2>

    <input type="email" placeholder="Email">
    <input type="password" placeholder="Senha">

    <div class="user-type">
      <div class="card adotador" data-type="adotador">Adotador</div>
      <div class="card ong" data-type="ong">ONG</div>
    </div>

    <button id="entrar">Entrar</button>
  </div>
</div>

<!-- MODAL PET -->
<div class="modal" id="petModal">
  <div class="modal-content" id="petDetails"></div>
</div>

<script src="script.js"></script>
</body>
</html>

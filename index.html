<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>PetMatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🐾 PetMatch</h1>
  <button id="loginBtn">Login</button>
</header>

<nav id="menu" class="hidden">
  <button data-page="pets">Pets</button>
  <button data-page="favoritos">Favoritos</button>
  <button data-page="quiz">Compatibilidade</button>
</nav>

<main>
  <section id="pets" class="page"></section>
  <section id="favoritos" class="page hidden"></section>
  <section id="quiz" class="page hidden"></section>
</main>

<!-- LOGIN -->
<div class="modal" id="loginModal">
  <div class="modal-box">
    <h2>Login</h2>
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Senha">

    <div class="user-type">
      <div class="card" data-type="adotador">Adotador</div>
      <div class="card" data-type="ong">ONG</div>
    </div>

    <button id="enterBtn">Entrar</button>
  </div>
</div>

<!-- DETALHES -->
<div class="modal" id="petModal">
  <div class="modal-box" id="petDetails"></div>
</div>

<script src="script.js"></script>
</body>
</html>
